<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Café Cloud - Pedidos</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; text-align: center; }
        input, button { padding: 10px; margin: 10px; width: 80%; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #218838; }
        #mensaje { margin-top: 20px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <h1>☕ Café Cloud Express</h1>
    <h3>Haz tu pedido Serverless</h3>
    
    <input type="text" id="nombre" placeholder="Tu Nombre">
    <input type="text" id="producto" placeholder="¿Qué café quieres? (ej. Latte)">
    <button onclick="enviarPedido()">Ordenar Ahora</button>
    
    <div id="mensaje"></div>

    <script>
        // REEMPLAZA ESTA URL CON LA TUYA
        const API_URL = "https://qjntcouks6.execute-api.us-east-1.amazonaws.com/pedido"; 

        async function enviarPedido() {
            const nombre = document.getElementById('nombre').value;
            const producto = document.getElementById('producto').value;
            const mensajeDiv = document.getElementById('mensaje');

            if (!nombre || !producto) {
                mensajeDiv.innerHTML = "❌ Por favor llena todos los campos";
                return;
            }

            mensajeDiv.innerHTML = "⏳ Enviando pedido a la nube...";

            try {
                const respuesta = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cliente: nombre, producto: producto })
                });

                const resultado = await respuesta.json();
                
                if (respuesta.ok) {
                    mensajeDiv.innerHTML = "✅ ¡Éxito! " + resultado;
                    mensajeDiv.style.color = "green";
                } else {
                    mensajeDiv.innerHTML = "⚠️ Error: " + JSON.stringify(resultado);
                }
            } catch (error) {
                console.error(error);
                mensajeDiv.innerHTML = "❌ Error de conexión. Revisa la consola (F12).";
                mensajeDiv.style.color = "red";
            }
        }
    </script>
</body>
</html>
